name: fleet-determinism-run
on:
  workflow_dispatch:

jobs:
  kit-linux:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: fetch the phase-1 kit
        run: python3 -c "import os,urllib.request; os.makedirs('kit',exist_ok=True); [urllib.request.urlretrieve('https://gist.githubusercontent.com/c0wb0yp0tat0/4b594abbec93a81aa4545b3834d782d6/raw/'+f, os.path.join('kit', f.replace('PILOTKIT-',''))) for f in ['PILOTKIT-stall_probe.py','PILOTKIT-memory_tool_store.py','PILOTKIT-README.md']]"
      - name: run the phase-1 envelope (the kit's own RUN.sh)
        run: |
          cd kit
          sh RUN.sh
      - name: emit the fleet receipt
        run: |
          cd kit
          echo "## fleet determinism run" >> "$GITHUB_STEP_SUMMARY"
          echo "machine: $RUNNER_NAME · os: $RUNNER_OS" >> "$GITHUB_STEP_SUMMARY"
          echo "receipt sha256: $RECEIPT_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "expected: 3ff6aee45b16d45b6d8db1084381c6447f549fd01ab72da11c4aedcb5071fba9" >> "$GITHUB_STEP_SUMMARY"

  kit-windows:
    runs-on: [self-hosted, Windows]
    steps:
      - name: fetch the phase-1 kit (cmd — no policy layer; the Avrea runner used creatively)
        shell: cmd
        run: wsl python3 -c "import os,urllib.request; os.makedirs('kit',exist_ok=True); [urllib.request.urlretrieve('https://gist.githubusercontent.com/c0wb0yp0tat0/4b594abbec93a81aa4545b3834d782d6/raw/'+f, os.path.join('kit', f.replace('PILOTKIT-',''))) for f in ['PILOTKIT-stall_probe.py','PILOTKIT-memory_tool_store.py','PILOTKIT-README.md']]"
      - name: run the phase-1 envelope
        shell: cmd
        run: |
          cd kit
          wsl python3 stall_probe.py > receipt.json 2>&1
          wsl python3 -c "import json; r=json.load(open('receipt.json')); [print(f'{k}: ' + ('RED' if r[k].get('rollback_observed') else 'GREEN')) for k in ['as-at-pin','lock-removed','cache-write-restored','both-removed']]"
          wsl python3 -c "import hashlib,os; open(os.environ['GITHUB_ENV'],'a').write('RECEIPT_SHA='+hashlib.sha256(open('receipt.json','rb').read()).hexdigest()+chr(10))"
      - name: emit the fleet receipt
        shell: cmd
        run: |
          cd kit
          echo ## fleet determinism run >> "%GITHUB_STEP_SUMMARY%"
          echo machine: %RUNNER_NAME% os: %RUNNER_OS% >> "%GITHUB_STEP_SUMMARY%"
          echo receipt sha256: %RECEIPT_SHA% >> "%GITHUB_STEP_SUMMARY%"
          echo expected: 3ff6aee45b16d45b6d8db1084381c6447f549fd01ab72da11c4aedcb5071fba9 >> "%GITHUB_STEP_SUMMARY%"
