name: rig-hosted-verify-avrea (the parallel verification surface)

# The Avrea-parallel leg: the SAME pinned head + the SAME uv-recipe, measured on
# Avrea's dedicated runners (the free-meter's monthly minutes — the 4-vCPU class
# consumes 1,500 min/mo proportionally). Side-by-side with the GitHub-window runs:
# the divergence is the data, exactly like the committed-and-verified live receipts.

on:
  workflow_dispatch:
    inputs:
      head_sha:
        description: "The exact SHA to pin and verify (default: the branch head)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  verify:
    name: Avrea full-suite (${{ github.ref_name }})
    runs-on: avrea-ubuntu-latest-4-vcpu
    timeout-minutes: 45
    steps:
      - name: Checkout exact head
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.head_sha || '' }}

      - name: Pin verification to the executed tree
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'requested_sha=%s\nexecuted_sha=%s\n' "${{ github.sha }}" "$actual"
          test "$actual" = "${{ github.sha }}"

      - name: Install uv (the repo's own recipe)
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          python-version: "3.14"

      - name: Sync the locked environment
        shell: bash
        run: |
          uv python install 3.14
          HERMES_DISABLE_LAZY_INSTALLS=1 uv sync --locked --python 3.14 \
            --extra all --group dev \
            --extra anthropic --extra mistral --extra fal --extra modal \
            --extra daytona --extra parallel-web

      - name: The verification battery (write-gate + memory-tool + agent-bridge + scripts)
        shell: bash
        run: |
          python -m pytest \
            tests/tools/test_write_gate.py \
            tests/memory/test_memory_tool.py \
            tests/tools/test_spa_integration.py \
            tests/tools/test_dream_cycle.py \
            -rs -q 2>&1 | tail -40
