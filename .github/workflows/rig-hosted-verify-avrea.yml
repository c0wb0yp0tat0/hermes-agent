name: rig-hosted-verify-avrea (the parallel verification surface)

# The Avrea-parallel leg: the SAME pinned head + the SAME uv-recipe, measured on
# Avrea's dedicated runners (the free-meter's monthly minutes — the 4-vCPU class
# consumes 1,500 min/mo proportionally). Side-by-side with the GitHub-window runs:
# the divergence is the data, exactly like the committed-and-verified live receipts.

on:
  workflow_dispatch:
    inputs:
      head_sha:
        description: "The exact SHA to pin and verify (default: the branch head)"
        required: false
        default: ""
      battery:
        description: "The battery to run: union (all present), tools (write-gate + memory-tool), falsifier (the falsifier dir)"
        required: false
        default: "union"
        type: choice
        options:
          - union
          - tools
          - falsifier
          - sweep
          - stress

concurrency:
  # kvnloo's pin-scoped shape: one active run per pinned head; a re-dispatch
  # of the SAME pin cancels the stale one, different pins run in parallel.
  group: avrea-${{ github.workflow }}-${{ inputs.head_sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  verify:
    name: Avrea full-suite (${{ github.ref_name }})
    runs-on: avrea-ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact head
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false
          # A full clone: an arbitrary pinned SHA is not reachable from a
          # shallow (depth-1) checkout, so "Checking out the ref" fails.
          fetch-depth: 0
          ref: ${{ inputs.head_sha || '' }}

      - name: Pin verification to the executed tree
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          # The requested head is the dispatch input when given; github.sha is
          # the branch head (main) and is NOT the pinned tree on a dispatch.
          requested="${{ inputs.head_sha || github.sha }}"
          printf 'requested_sha=%s\nexecuted_sha=%s\n' "$requested" "$actual"
          test "$actual" = "$requested"

      - name: Install uv (the repo's own recipe)
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          python-version: "3.14"

      - name: Sync the locked environment
        shell: bash
        run: |
          uv python install 3.14
          HERMES_DISABLE_LAZY_INSTALLS=1 uv sync --locked --python 3.14 \
            --extra all --group dev \
            --extra anthropic --extra mistral --extra fal --extra modal \
            --extra daytona --extra parallel-web

      - name: The verification battery (write-gate + memory-tool + falsifier-battery)
        shell: bash
        run: |
          # uv run: the synced venv's interpreter, never the PATH's system
          # python (which has no pytest and none of the synced deps).
          # Path-tolerance (earned 2026-11-05): the falsifier-battery lives on
          # the battery lineage (fixes/falsifier-battery-20261104), NOT on every
          # pinned head — include it only when present, so pins predating it
          # still get the write-gate + memory-tool battery (exit-4 class: a
          # missing path is a collection error, not an assertion failure).
          # Collect-only-what-exists: the composition heads predate the
          # write-gate/memory-tool suites and the falsifier dir — a fixed path
          # list dies at collection (exit 4) on any pin that lacks it. The
          # battery is the INTERSECTION of the head's tree and the suite.
          BASE=""
          case "${{ inputs.battery || 'union' }}" in
            tools)
              for f in tests/tools/test_write_gate.py tests/tools/test_memory_tool.py; do
                [ -f "$f" ] && BASE="$BASE $f"
              done ;;
            falsifier)
              [ -d tests/falsifier-battery ] && BASE="tests/falsifier-battery/" ;;
            union|*)
              for f in tests/tools/test_write_gate.py tests/tools/test_memory_tool.py; do
                [ -f "$f" ] && BASE="$BASE $f"
              done
              [ -d tests/falsifier-battery ] && BASE="$BASE tests/falsifier-battery/" ;;
          esac
          uv run pytest $BASE -rs -q 2>&1 | tail -40

      - name: The specialized arms (sweep / stress — the instruments executed at the pinned head)
        if: ${{ inputs.battery == 'sweep' || inputs.battery == 'stress' }}
        shell: bash
        run: |
          cd studies/rfc-143379-rig/krecency
          CYCLES="${{ inputs.battery == 'stress' && '1200' || '300' }}"
          echo "specialized arm: ${{ inputs.battery }} at cycles=$CYCLES (pinned head) — the instrument executed, not assumed."
          uv run --project ../../../ python sweep_alias.py && uv run --project ../../../ python sweep_age.py 2>&1 | tail -6
          ls -la results/ | tail -6

      - name: The receipt's landing (every avrea runner lands its findings on PR #1 - the machine's own voice)
        if: always()
        shell: bash
        env:
          LAND_REPO: ${{ github.repository }}
          LAND_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LAND_RUN_ID: ${{ github.run_id }}
          LAND_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LAND_PIN: ${{ inputs.head_sha }}
          LAND_BATTERY: ${{ inputs.battery || 'union' }}
          LAND_RESULT: ${{ job.status }}
        run: |
          if [ "$LAND_RESULT" = "success" ]; then
            SUMMARY="GREEN - the $LAND_BATTERY arm at the pinned head completed."
          else
            SUMMARY="RED - the $LAND_BATTERY arm at the pinned head failed (the run's log carries the cause)."
          fi
          export LAND_BODY="**[RUNNER-LANDING]** - run $LAND_RUN_ID ($LAND_BATTERY @ ${LAND_PIN:0:40}): $LAND_RESULT. $SUMMARY Run: $LAND_RUN_URL. Landed by the machine itself, per the standing rule - all avrea runners land their findings on PR #1."
          python3 - <<'PYEOF'
          import json, os, urllib.request
          body = os.environ["LAND_BODY"]
          data = json.dumps({"body": body}).encode()
          req = urllib.request.Request(
              "https://api.github.com/repos/" + os.environ["LAND_REPO"] + "/issues/1/comments",
              data=data,
              headers={"Authorization": "token " + os.environ["LAND_TOKEN"], "Content-Type": "application/json", "Accept": "application/vnd.github+json"},
              method="POST")
          try:
              with urllib.request.urlopen(req, timeout=60) as r:
                  print("landed:", r.status)
          except Exception as e:
              print("landing-post failed (recorded - the head's cadence will carry it):", e)
          PYEOF
