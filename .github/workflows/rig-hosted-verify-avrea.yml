name: rig-hosted-verify-avrea (the parallel verification surface)

# The Avrea-parallel leg: the SAME pinned head + the SAME uv-recipe, measured on
# Avrea's dedicated runners (the free-meter's monthly minutes — the 4-vCPU class
# consumes 1,500 min/mo proportionally). Side-by-side with the GitHub-window runs:
# the divergence is the data, exactly like the committed-and-verified live receipts.

on:
  workflow_dispatch:
    inputs:
      head_sha:
        description: "The exact SHA to pin and verify (default: the branch head)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  verify:
    name: Avrea full-suite (${{ github.ref_name }})
    strategy:
      fail-fast: false
      matrix:
        runner: [avrea-ubuntu-latest-2-vcpu, avrea-ubuntu-latest, ubuntu-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - name: Checkout exact head
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false
          # A full clone: an arbitrary pinned SHA is not reachable from a
          # shallow (depth-1) checkout, so "Checking out the ref" fails.
          fetch-depth: 0
          ref: ${{ inputs.head_sha || '' }}

      - name: Pin verification to the executed tree
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          # The requested head is the dispatch input when given; github.sha is
          # the branch head (main) and is NOT the pinned tree on a dispatch.
          requested="${{ inputs.head_sha || github.sha }}"
          printf 'requested_sha=%s\nexecuted_sha=%s\n' "$requested" "$actual"
          test "$actual" = "$requested"

      - name: Install uv (the repo's own recipe)
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          python-version: "3.14"

      - name: Sync the locked environment
        shell: bash
        run: |
          uv python install 3.14
          HERMES_DISABLE_LAZY_INSTALLS=1 uv sync --locked --python 3.14 \
            --extra all --group dev \
            --extra anthropic --extra mistral --extra fal --extra modal \
            --extra daytona --extra parallel-web

      - name: The verification battery (write-gate + memory-tool + falsifier-battery)
        shell: bash
        run: |
          echo "ENV-SNAPSHOT: pwd=$(pwd | sed 's|/home/runner.*|/home/runner|') | git-root=$(git rev-parse --show-toplevel 2>/dev/null || echo none) | python=$(python3 --version 2>&1) | uid=$(id -u) | CI=${CI:-unset}"
          echo "ENV-SNAPSHOT: workspace=$GITHUB_WORKSPACE | repo=$(basename "${GITHUB_WORKSPACE:-.}") | ref=$GITHUB_REF_NAME"
          # Path-tolerance (earned 2026-11-05): the falsifier-battery lives on
          # the battery lineage (fixes/falsifier-battery-20261104), NOT on every
          # pinned head — include it only when present, so pins predating it
          # still get the write-gate + memory-tool battery (exit-4 class: a
          # missing path is a collection error, not an assertion failure).
          # THE TWO-ROOT SPLIT (earned 2026-11-15, the ImportPathMismatchError class):
          # the root tests/ and the study's studies/.../tests/ both declare
          # tests.conftest — pytest cannot run BOTH roots in ONE invocation (the
          # field's own cure: separate invocations per root; --import-mode=importlib
          # fails with 'Plugin already registered' — confirmed by the 11-15
          # gemba split: root 16 passed/77 skipped, study arms separate).
          # The output is NEVER grep-filtered — a pipefail no-match grep masks
          # the real error (the 11-15 blind-exit-1 class); each invocation logs
          # raw, tailed, exit code respected.
          mkdir -p studies/rfc-143379-rig/CYCLES
          echo "{\"t\":$(date +%s),\"req_bytes\":1}" >> studies/rfc-143379-rig/CYCLES/battery-receipt.jsonl
          export S2U_LEDGER="$GITHUB_WORKSPACE/studies/rfc-143379-rig/CYCLES/battery-receipt.jsonl"
          ROOT_BASE="tests/tools/test_memory_tool.py"
          [ -f tests/tools/test_write_gate.py ] && ROOT_BASE="$ROOT_BASE tests/tools/test_write_gate.py"
          [ -d tests/falsifier-battery ] && ROOT_BASE="$ROOT_BASE tests/falsifier-battery/"
          echo "ROOT-BATTERY: uv run pytest $ROOT_BASE"
          uv run pytest $ROOT_BASE -rs -q > /tmp/root-battery.log 2>&1; RC1=$?
          tail -25 /tmp/root-battery.log
          echo "ROOT-BATTERY-EXIT: $RC1"
          STUDY_ARM=""
          [ -d studies/rfc-143379-rig/tests/s2u_arms ] && STUDY_ARM="studies/rfc-143379-rig/tests/s2u_arms/"
          if [ -n "$STUDY_ARM" ]; then
            echo "STUDY-ARMS: uv run pytest $STUDY_ARM"
            uv run pytest $STUDY_ARM -rs -q > /tmp/study-arms.log 2>&1; RC2=$?
            tail -25 /tmp/study-arms.log
            echo "STUDY-ARMS-EXIT: $RC2"
          else
            RC2=0
          fi
          # THE NAMED-RED REGISTER (earned 2026-11-15): the study arms carry STAGED
          # REDs by design (the write-gate ablation arm names its seam itself: "the
          # gate's surface is unreachable — RED-for-now"); a named-RED is a receipted
          # register entry, distinct from a regression. The 11-15 gemba: the frozen-
          # safety arm (staged-RED, seam named) + the single-layer-ablation arm
          # (tautology-class: ablates one layer then asserts BOTH remain — can never
          # pass; its logic is its own finding, the repair is the write-gate leg's).
          # The battery's verdict: GREEN = no UNEXPECTED failures; the named set
          # rides the register, never hides a red — the log names it.
          exit $(( RC1 != 0 || RC2 != 0 ? 1 : 0 ))

      - name: The S2U claims probe (the fresh-test-in-response, independent convergence)
        shell: bash
        if: always()
        run: |
          set -euo pipefail
          if [ -f studies/rfc-143379-rig/scripts/s2u-claims-probe.py ]; then
            uv run python studies/rfc-143379-rig/scripts/s2u-claims-probe.py 2>&1 | tail -50
          else
            echo "S2U-CLAIMS: NOT-RUN (the probe script absent at this pinned head)"
          fi
