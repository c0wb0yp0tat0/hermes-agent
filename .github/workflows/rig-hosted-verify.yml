name: rig-hosted-verify (round2-gate gate)

# The corrected gate (2026-11-05): the avrea runner label (the only live
# self-hosted runner surface), executed-head pinning (requested == executed),
# and the union battery (write-gate + memory-tool + consent/orphan + falsifier).
# The GitHub-hosted (ubuntu-latest) shape queued forever — no hosted runner
# exists for this fork; the pin was also wrong (d1bdb4582, not the branch head).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: round2-gate verification (${{ github.ref_name }})
    runs-on: avrea-ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact head
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Pin verification to the executed tree
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          requested="${{ github.sha }}"
          printf 'requested_sha=%s\nexecuted_sha=%s\n' "$requested" "$actual"
          test "$actual" = "$requested"

      - name: Install uv (the repo's own recipe)
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          python-version: "3.14"

      - name: Sync the locked environment
        shell: bash
        run: |
          uv python install 3.14
          HERMES_DISABLE_LAZY_INSTALLS=1 uv sync --locked --python 3.14 \
            --extra all --group dev \
            --extra anthropic --extra mistral --extra fal --extra modal \
            --extra daytona --extra parallel-web

      - name: The verification battery (write-gate + memory-tool + consent/orphan + falsifier)
        shell: bash
        run: |
          BASE="tests/tools/test_write_gate.py tests/tools/test_memory_tool_schema.py tests/tools/test_memory_tool.py tests/tools/test_memory_patch_action.py tests/tools/test_memory_target_contract.py tests/agent/test_memory_write_bridge.py"
          # the falsifier-battery lives on the battery branch; the round2 lineage
          # carries it only when merged — include it only when present
          [ -d tests/falsifier-battery ] && BASE="$BASE tests/falsifier-battery/"
          uv run pytest $BASE -rs -q 2>&1 | tail -40

      - name: Compile the tally
        shell: bash
        run: |
          {
            echo "# round2-gate hosted verification tally"
            echo
            echo "Target head: ${GITHUB_SHA}"
            echo "Runner: $(uname -s) $(uname -m) — $(nproc) cores"
            echo "Python: $(uv run python --version 2>/dev/null || python3 --version)"
          } > TALLY.md
          cat TALLY.md

      - name: Upload the tally artifact
        uses: actions/upload-artifact@v4
        with:
          name: round2-gate-verify-tally
          path: TALLY.md
