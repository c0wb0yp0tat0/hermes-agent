name: local-lm-test

on:
  workflow_dispatch:
    inputs:
      study_ref:
        description: "study branch or commit to test against"
        required: true
        default: "study/rfc-143379-rig-20261105"
      run_id:
        description: "unique run id (for artifact naming)"
        required: false
        default: "local-lm-001"
      cell_prompt:
        description: "the battery cell's prompt (free text; overrides the recite line)"
        required: false
        default: "Recite: 'Faciamus. Semper. Simul. Iterum.'"
      steer_prompt:
        description: "the second-turn steer (colibri serve path only; the replace-with-deliverable test)"
        required: false
        default: "Replace the posted comment body ('@/tmp/row-launch.md') with your deliverable. Return ONLY the final comment text, envelope + body, ready to post."
      model_profile:
        description: "fast small-LM profile"
        required: false
        default: "qwen2.5-0.5b-q4km"
        type: choice
        options:
          - qwen2.5-0.5b-q4km
          - qwen2.5-1.5b-q4km
          - phi3.5-mini-q4km
      engine_profile:
        description: "engine build profile"
        required: false
        default: "llama-cpp-cpu"
        type: choice
        options:
          - llama-cpp-cpu
          - ik-llama-cpu
          - colibri-olmoe

concurrency:
  group: local-lm-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  local-lm:
    name: local-lm battery on avrea runner
    runs-on: [self-hosted, avrea-ubuntu-latest]
    timeout-minutes: 360
    env:
      STUDY_REF: ${{ github.event.inputs.study_ref }}
      RUN_ID: ${{ github.event.inputs.run_id }}
      MODEL_PROFILE: ${{ github.event.inputs.model_profile }}
      ENGINE_PROFILE: ${{ github.event.inputs.engine_profile }}
      CELL_PROMPT: ${{ github.event.inputs.cell_prompt }}
      STEER_PROMPT: ${{ github.event.inputs.steer_prompt }}
      LLAMA_THREADS: "10"
      LLAMA_CTX: "4096"
    steps:
      - name: checkout study ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.study_ref }}
          fetch-depth: 1

      - name: runner header (hardware receipt)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/local-lm
          {
            echo "=== RUNNER HARDWARE HEADER ==="
            echo "run_id=${RUN_ID}"
            echo "study_ref=${STUDY_REF}"
            echo "engine_profile=${ENGINE_PROFILE}"
            echo "hostname=$(hostname)"
            echo "nproc=$(nproc)"
            echo "mem_total_gb=$(free -g | awk '/^Mem:/{print $2}')"
            echo "cpu_model=$(lscpu | awk -F: '/Model name/{gsub(/^ +/,"",$2);print $2;exit}')"
            echo "cpu_flags=$(lscpu | awk -F: '/Flags/{print $2}' | tr ' ' '\n' | grep -E 'avx2|avx512f|avx512bw' | sort -u | tr '\n' ' ')"
            echo "runner_root=/opt/actions-runner"
            echo "github_workspace=${GITHUB_WORKSPACE}"
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee results/local-lm/hardware-header.txt

      - name: checkout the battery tooling (the dispatched engine profile's helpers)
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin rig/local-lm-colibri-20261113 --depth 1 2>/dev/null || true
          git checkout origin/rig/local-lm-colibri-20261113 -- .github/local-lm 2>/dev/null || true
          ls -la .github/local-lm 2>/dev/null || echo "no-local-lm-helpers"

      - name: build engine (minimal, CPU)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p engine
          if [ "${ENGINE_PROFILE}" = "colibri-olmoe" ]; then
            if [ ! -x engine/olmoe ]; then
              mkdir -p .build
              git clone --depth 1 https://github.com/JustVugg/colibri.git .build/colibri
              make -C .build/colibri/c olmoe ARCH=native -j "${LLAMA_THREADS}"
              cp .build/colibri/c/olmoe engine/olmoe
            fi
            cp .github/local-lm/coli-wrapper.py engine/coli.py
            echo "engine-built: $(ls -la engine/ | head -3)"
          else
            if [ ! -x engine/llama-cli ]; then
              git clone --depth 1 https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
              cmake -S /tmp/llama.cpp -B /tmp/llama.cpp/build -DCMAKE_BUILD_TYPE=Release -DLLAMA_METAL=OFF -DGGML_CUDA=OFF
              cmake --build /tmp/llama.cpp/build --config Release -j "${LLAMA_THREADS}"
              cp /tmp/llama.cpp/build/bin/llama-cli engine/llama-cli
            fi
            echo "engine-built: $(ls -la engine/ | head -3)"
          fi

      - name: fetch model (smallest viable quantized)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p models
          if [ "${ENGINE_PROFILE}" = "colibri-olmoe" ]; then
            if [ ! -d models/olmoe ]; then
              python3 -m venv /tmp/hfvenv
              /tmp/hfvenv/bin/pip install -q huggingface_hub
              /tmp/hfvenv/bin/python -c "from huggingface_hub import snapshot_download; snapshot_download('Krishal/OLMoE-1B-7B-0125-Instruct-Colibri', local_dir='models/olmoe', max_workers=4)"
            else
              echo "cached: models/olmoe"
            fi
            du -sh models/olmoe | tee models/olmoe.size
            echo "MODEL_DIR=models/olmoe" >> "$GITHUB_ENV"
          else
            case "${MODEL_PROFILE}" in
              qwen2.5-0.5b-q4km)
                URL="https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf"
                FILE="qwen2.5-0.5b-instruct-q4_k_m.gguf"
                ;;
              qwen2.5-1.5b-q4km)
                URL="https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf"
                FILE="qwen2.5-1.5b-instruct-q4_k_m.gguf"
                ;;
              phi3.5-mini-q4km)
                URL="https://huggingface.co/bartowski/Phi-3.5-mini-instruct-GGUF/resolve/main/Phi-3.5-mini-instruct-Q4_K_M.gguf"
                FILE="Phi-3.5-mini-instruct-Q4_K_M.gguf"
                ;;
            esac
            if [ ! -f "models/${FILE}" ]; then
              echo "downloading ${FILE}"
              curl -L --fail --retry 3 -o "models/${FILE}.part" "${URL}"
              mv "models/${FILE}.part" "models/${FILE}"
            else
              echo "cached: models/${FILE}"
            fi
            sha256sum "models/${FILE}" | tee "models/${FILE}.sha256"
            echo "MODEL_FILE=models/${FILE}" >> "$GITHUB_ENV"
          fi

      - name: run probe battery (the local-LM aspect's feasibility read)
        shell: bash
        env:
          ENGINE_BIN: ${{ github.workspace }}/engine/llama-cli
        run: |
          set -euo pipefail
          mkdir -p results/local-lm
          {
            echo "=== LOCAL-LM BATTERY ==="
            echo "run_id=${RUN_ID}"
            echo "model=${MODEL_PROFILE}"
            echo "engine=${ENGINE_PROFILE}"
            echo "threads=${LLAMA_THREADS} ctx=${LLAMA_CTX}"
            echo "prompt: ${CELL_PROMPT}"
            if [ "${ENGINE_PROFILE}" = "colibri-olmoe" ]; then
              echo "--- colibri one-shot (the llama-cli parity) ---"
              timeout 600 env COLI_MODEL="${{ github.workspace }}/models/olmoe" \
                python3 engine/coli.py run "${CELL_PROMPT}" --ngen 64 2>&1 | head -40
              echo "--- colibri serve bridge (the Hermes-provider shape) ---"
              timeout 600 env COLI_MODEL="${{ github.workspace }}/models/olmoe" \
                python3 engine/coli.py serve --port 8099 > /tmp/coli-serve.log 2>&1 &
              COLIPID=$!
              for i in $(seq 1 30); do
                curl -s -m 2 http://127.0.0.1:8099/v1/models >/dev/null 2>&1 && break
                sleep 5
              done
              echo "models-endpoint: $(curl -s -m 5 http://127.0.0.1:8099/v1/models | head -c 220)"
              echo "--- chat turn 1 (the deliverable) ---"
              REPLY1=$(python3 -c "import json,os,urllib.request; b=json.dumps({'model':'olmoe-colibri','messages':[{'role':'user','content':os.environ['CELL_PROMPT']}],'max_tokens':200}).encode(); req=urllib.request.Request('http://127.0.0.1:8099/v1/chat/completions',data=b,headers={'Content-Type':'application/json'}); d=json.load(urllib.request.urlopen(req,timeout=300)); c=(d['choices'][0]['message'].get('content') or ''); open('/tmp/reply1.txt','w').write(c); print(c)")
              echo "reply1 chars: ${#REPLY1}"
              echo "--- chat turn 2 (the steer: replace the pointer with your deliverable) ---"
              python3 -c "import os; open('/tmp/steer.txt','w').write(os.environ['STEER_PROMPT'])"
              REPLY2=$(python3 -c "import json,os,urllib.request; b=json.dumps({'model':'olmoe-colibri','messages':[{'role':'user','content':os.environ['CELL_PROMPT']},{'role':'assistant','content':open('/tmp/reply1.txt').read()},{'role':'user','content':open('/tmp/steer.txt').read()}],'max_tokens':200}).encode(); req=urllib.request.Request('http://127.0.0.1:8099/v1/chat/completions',data=b,headers={'Content-Type':'application/json'}); d=json.load(urllib.request.urlopen(req,timeout=300)); c=(d['choices'][0]['message'].get('content') or ''); open('/tmp/reply2.txt','w').write(c); print(c)")
              echo "reply2 chars: ${#REPLY2}"
              cp /tmp/reply1.txt /tmp/reply2.txt /tmp/steer.txt results/local-lm/ 2>/dev/null || true
              kill $COLIPID 2>/dev/null || true
            else
              timeout 300 "${ENGINE_BIN}" -m "${{ github.workspace }}/${MODEL_FILE}" -p "${CELL_PROMPT}" -n 64 -t "${LLAMA_THREADS}" -c "${LLAMA_CTX}" 2>&1 | head -20
            fi
            echo "=== battery-verdict ==="
            echo "cell=recite-anchor status=EXECUTED verdict=PENDING-REVIEW"
          } | tee results/local-lm/battery-results.txt
          echo "BATTERY_DONE=1" >> "$GITHUB_ENV"

      - name: emit the run-receipt
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "=== LOCAL-LM RUN RECEIPT ==="
            echo "run_id=${RUN_ID}"
            echo "engine_profile=${ENGINE_PROFILE}"
            echo "status=COMPLETED"
            echo "receipt_path=results/local-lm/battery-results.txt"
            echo "hardware=results/local-lm/hardware-header.txt"
            echo "next=review by the operator; re-run with the next model-profile"
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee results/local-lm/run-receipt.txt

      - name: upload the battery's artifacts
        uses: actions/upload-artifact@v4
        with:
          name: local-lm-${{ github.event.inputs.run_id }}
          path: results/local-lm/
          if-no-files-found: warn
