name: stall-run-second-machine
on:
  workflow_dispatch:

jobs:
  stall-probe-loom:
    runs-on: [self-hosted, loom]
    steps:
      - name: fetch the instrument (gist raw, no secrets)
        run: |
          mkdir -p run && cd run
          BASE=https://gist.githubusercontent.com/c0wb0yp0tat0/26eefa7e612c61baff1918b1069156d6/raw
          curl -sSfL -o RW-STALL-PROBE-20261124.py   "$BASE/f441ec713ce5290d851607726aa82430a9864eb7/RW-STALL-PROBE-20261124.py"
          curl -sSfL -o RW-STORE-PINNED-a9c65dc4.py  "$BASE/2568732c3925144be879d0e2da87a86e558a484e/RW-STORE-PINNED-a9c65dc4.py"
      - name: run the envelope (deterministic; byte-identical across machines)
        run: |
          cd run && python3 RW-STALL-PROBE-20261124.py > receipt.json 2>&1
          echo "--- receipt ---"
          cat receipt.json
          echo "--- hashes ---"
          sha256sum receipt.json RW-STALL-PROBE-20261124.py RW-STORE-PINNED-a9c65dc4.py
      - name: emit the receipt marker
        run: |
          cd run
          H=$(sha256sum receipt.json | cut -d' ' -f1)
          echo "STALL_RECEIPT_SHA=$H" >> "$GITHUB_ENV"
      - name: summary
        run: |
          cd run
          echo "## second-machine stall receipt" >> "$GITHUB_STEP_SUMMARY"
          echo "machine: $RUNNER_NAME · os: $RUNNER_OS" >> "$GITHUB_STEP_SUMMARY"
          echo "receipt sha256: $(grep -c rollback_observed receipt.json) variants reported" >> "$GITHUB_STEP_SUMMARY"
          tail -12 receipt.json >> "$GITHUB_STEP_SUMMARY"
