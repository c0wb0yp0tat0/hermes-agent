name: fabric-battery

# The fabric's hosted window: one workflow, deployed fork-by-fork, firing on each
# fork's own free GitHub-hosted runner. The same exact pin, the same battery.
on:
  workflow_dispatch:
    inputs:
      head_sha:
        description: "exact 40-char pin (requested)"
        required: true

concurrency:
  group: verify-${{ inputs.head_sha }}-hosted-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  battery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: The pin's checkout (the upstream, exact ref)
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ inputs.head_sha }}
          fetch-depth: 0

      - name: ASSERT the pin (requested == executed)
        run: |
          EXEC=$(git rev-parse HEAD)
          echo "requested=${{ inputs.head_sha }}"
          echo "executed=$EXEC"
          [ "$EXEC" = "${{ inputs.head_sha }}" ] || { echo "PIN MISMATCH"; exit 1; }

      - name: Install uv (the repo's own recipe)
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Sync the locked environment
        shell: bash
        run: |
          uv python install 3.14
          HERMES_DISABLE_LAZY_INSTALLS=1 uv sync --locked --python 3.14 \
            --extra all --group dev \
            --extra anthropic --extra mistral --extra fal --extra modal || true

      - name: The battery (the study's arms, PATH- and SUBSTRATE-tolerant)
        shell: bash
        run: |
          set -o pipefail
          BASE="tests/tools/test_memory_tool.py"
          [ -f tests/tools/test_write_gate.py ] && BASE="$BASE tests/tools/test_write_gate.py"
          [ -d tests/falsifier-battery ] && BASE="$BASE tests/falsifier-battery/"
          echo "battery: $BASE"
          uv run pytest $BASE -rs -q 2>&1 | tail -30

      - name: The receipt row (envelope-shaped, per fork)
        if: always()
        shell: bash
        run: |
          echo "id: 20261128-fabric-${{ github.repository }}-${{ github.run_id }}"
          echo "run: ${{ github.run_id }}"
          echo "pin: ${{ inputs.head_sha }}"
          echo "requested: ${{ inputs.head_sha }}"
          echo "executed: $(git rev-parse HEAD)"
          echo "repo: ${{ github.repository }}"
          echo "conclusion: ${{ job.status }}"
          echo "receipt_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
